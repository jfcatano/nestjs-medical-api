version: '3.8'

services:
    api:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
        - "3000:3000"
      environment:
        - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/patients_db
        - JWT_SECRET=secretKey123ForDevelopmentOnly
        - OPENAI_API_KEY=${OPENAI_API_KEY}
      depends_on:
        - postgres
      networks:
        - app-network
      restart: unless-stopped

    postgres:
        image: postgres:14-alpine
        ports:
            - '5432:5432'
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=patients_db
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app-network
        restart: unless-stopped

networks:
    app-network:
        driver: bridge

volumes:
    postgres_data:
